
# Application name reported in Spring Boot startup logs / Actuator info.
spring.application.name=HachionUserDashboard
# Lets a later bean definition silently replace an earlier one with the same
# name instead of failing startup.
spring.main.allow-bean-definition-overriding=true

# Hibernate SQL dialect to generate for a MySQL 8 database.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# JDBC driver class used to open MySQL connections.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Hibernate auto-updates the DB schema to match the JPA entities on every
# startup instead of using versioned migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
# Logs every generated SQL statement to the console.
spring.jpa.show-sql=true
# Binds the embedded Tomcat server to all network interfaces, not just
# localhost, so it's reachable from outside the host.
server.address=0.0.0.0

# Verbose request-handling logs for Spring MVC.
logging.level.org.springframework.web=DEBUG
# Verbose filter-chain/authentication logs for Spring Security.
logging.level.org.springframework.security=DEBUG
# Enables parsing of multipart/form-data (file upload) requests.
spring.servlet.multipart.enabled=true
# Per-file and per-request upload size limits (1GB each).
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB

# Tomcat-level caps mirroring the multipart limits above - POST body size,
# and how much of an oversized/rejected body Tomcat will read past before
# closing the connection.
server.tomcat.max-http-post-size=1073741824
server.tomcat.max-swallow-size=1073741824
# Fallback relative path for generic uploads when no absolute, env-driven
# path is configured for a given profile.
upload.path=HachionUserDashboard/uploads

# Folder for corporate-review image uploads.
image.upload.corporatereview.path=HachionUserDashboard/uploads

# Folder for the bulk "upload all images" feature; env override with a
# prod-host path as the fallback default.
upload.all.images.path=${UPLOAD_ALL_IMAGES_PATH:/home/ec2-user/uploads/prod/upload_all_images/}

# App is served at the web root - no context path prefix.
server.servlet.context-path=/

# Filesystem directory Spring exposes as static content under /uploads/**.
spring.web.resources.static-locations=file:${STATIC_UPLOADS_PATH:/home/ec2-user/uploads/images/}

# SMTP is now provider-agnostic and fully environment-driven - no hardcoded
# credential in source, so switching providers (Gmail, Office365, Amazon SES,
# SendGrid/Mailgun/Postmark SMTP relay, etc.) or rotating a revoked password
# is a MAIL_* environment variable change + restart, never a code change or
# rebuild. Host/port/username keep the current (non-secret) values as
# defaults so behavior is unchanged for anyone who already has MAIL_HOST/
# MAIL_PORT/MAIL_USERNAME set correctly; MAIL_PASSWORD has NO default - if
# it isn't set, spring.mail.password is empty and every send attempt fails
# fast and honestly (via OtpEmailDeliveryException / the same handling
# TalkToOurAdvisorServiceImpl and Userimpl.registerApi() already have),
# never with a hardcoded credential silently baked into the JAR.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:trainings@hachion.co}
spring.mail.password=${MAIL_PASSWORD:}
# Used by EmailUtil.sendOtpEmail() as the From: address instead of a
# hardcoded string literal - defaults to the same address as
# spring.mail.username unless explicitly overridden (e.g. if MAIL_USERNAME
# is an SES/SendGrid SMTP relay login that differs from the visible From
# address a recipient should see).
app.mail.from=${MAIL_FROM:${spring.mail.username}}
# Google Chat webhook used for visitor-tracking/internal notifications;
# empty default disables the notification instead of failing startup.
google.chat.webhook=${GOOGLE_CHAT_WEBHOOK_URL:}

# SMTP transport tuning: require authenticated STARTTLS, trust the SMTP
# server's certificate, cap connect/read/write waits at 10s each, and force
# TLS 1.2.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Verbose mail-sending logs.
logging.level.org.springframework.mail=DEBUG
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2


# OAuth2 Google Configuration
# Internal registration label Spring Security uses to identify this OAuth2
# client; not shown to end users, not a secret.
spring.security.oauth2.client.registration.google.client-name=google
# Public Google OAuth client identifier - not a secret, safe to commit.
spring.security.oauth2.client.registration.google.client-id=535817216730-k1snip927qroava99qgmi2hn8c8vig54.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
# Default (prod) callback URL Google redirects back to after consent; each
# profile below (dev/test/prod) overrides this with its own
# app.backend.base-url so each environment gets its own correct callback.
spring.security.oauth2.client.registration.google.redirect-uri=https://api.hachion.co/login/oauth2/code/google
# OAuth scopes requested from Google: OpenID identity, email address, basic profile.
spring.security.oauth2.client.registration.google.scope=openid, email,profile

# Twilio Account SID / Auth Token are provider secrets - sourced entirely
# from the TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN environment variables on
# whichever host runs this jar (test EC2 box on the "test" profile, prod EC2
# box on the "prod" profile), never hardcoded here and never passed as a -D
# system property (those show up in `ps aux`/process listings; a process's
# own environment does not). No default value is intentional here (unlike
# e.g. spring.mail.password's ${MAIL_PASSWORD:} pattern) - WhatsAppService's
# own try/catch around every Twilio call already treats a missing/invalid
# credential as a caught, logged, non-fatal failure at send time, so Spring
# context startup must not fail just because these two env vars aren't set
# yet; TwilioConfigStartupCheck logs (booleans only, never the values)
# whether each one actually resolved, for exactly that "is it wired up"
# question without needing to read secrets to answer it.
twilio.accountSid=${TWILIO_ACCOUNT_SID:}
twilio.authToken=${TWILIO_AUTH_TOKEN:}
# Twilio WhatsApp sender number used as the "from" address for WhatsApp messages.
twilio.fromWhatsApp=whatsapp:+15163632917
# Twilio Content Template SIDs (not secrets) - each selects which
# pre-approved WhatsApp message template to send for a given notification.
twilio.contentSid=HX2fdacb529c55276d8826fdc978e1bbbb
twilio.demoContentSid=HX6696548b8a37f94ebea0eb2a4f86c7f4
# Twilio SMS sender number.
twilio.fromSms=+15163632917

twilio.selfPacedContentSid=HX24be6bac97abe6fa931e0f0e79bb4016

twilio.mentoringModeContentSid=HX58d98cbf407b1ebbbb6ee214699307ca

twilio.enquiryContentSid=HXce8acfa225b9917973c40ab7a8b2519d

# Razorpay payment-gateway API credentials - env-only, same pattern as the
# Twilio pair above (no hardcoded default).
razorpay.key_id=${RAZORPAY_KEY_ID:}
razorpay.key_secret=${RAZORPAY_KEY_SECRET:}

# optional shared defaults
# Frontend route fallbacks used to build absolute redirect URLs; profiles
# below only override app.frontend.base-url, so these path suffixes apply
# across dev/test/prod unless a profile adds its own override.
app.frontend.paths.home=/
app.frontend.paths.login=/login
app.frontend.paths.signup=/phone-number
# Cookie domain/secure defaults; blank/false here, tightened per profile
# (see application-{test,prod}.properties).
app.cookies.domain=
app.cookies.secure=false


# Vitel API Config - integration with Vitel Global's call-billing/call-record
# system used to track trainer call activity. vitel.username is a login
# identifier (not a secret); only vitel.password is sensitive.
vitel.baseUrl=https://billing.vitelglobal.com/vitelglobal_callrecords.php
vitel.username=trainings@hachion.co
vitel.password=${VITEL_PASSWORD:}
vitel.extensionsCsv=101, 102, 104, 106,107,108,109,110
vitel.recordsZone=America/New_York
# How often (ms) the Vitel call-records poller runs.
poller.fixedDelayMs=30000

# Separate Google Chat webhook from google.chat.webhook above - a distinct
# notification path reads GCHAT_WEBHOOK_URL directly rather than this
# property (see WebhookSenderService), so both env vars exist independently.
gchat.webhookUrl=${GCHAT_WEBHOOK_URL:}

# Groups → which extensions belong to which window
schedules.groupA.members=101,104
schedules.groupA.windowsUtc=00:30-05:30,12:30-17:30


schedules.groupB.members=102,105,106,107,108,109,110
schedules.groupB.windowsUtc=12:30-23:30

# Local time windows (UTC) during which morning/evening EOD reports are expected.
eod.morning.window=06:00-11:00
eod.evening.window=18:00-23:00

# EOD posting safety + ordering
eod.maxChars=3500
eod.sortNumeric=false

# Run at 19:30 UTC daily = 01:00 IST
eod.cron=0 30 19 * * *
#eod.cron=0 50 18 * * *
# Timezone the EOD cron expression above is evaluated in.
eod.zone=UTC

# Cron schedule for the periodic sync job (2:30 AM UTC daily).
sync.cron=0 30 2 * * *

youtube.api.key=${YOUTUBE_API_KEY:}
# YouTube channel handle used to look up videos for the public YouTube feed.
youtube.channel.handle=@hachion


# simple cache
# In-memory Caffeine cache: capped at 200 entries, each expiring 5 minutes
# after being written.
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=200,expireAfterWrite=5m

openai.api.key=${OPENAI_API_KEY:}
# OpenAI Chat Completions endpoint used by OpenAIService.
openai.url=https://api.openai.com/v1/chat/completions
