# SMTP is now provider-agnostic and fully environment-driven - no hardcoded
# credential in source, so switching providers (Gmail, Office365, Amazon SES,
# SendGrid/Mailgun/Postmark SMTP relay, etc.) or rotating a revoked password
# is a MAIL_* environment variable change + restart, never a code change or
# rebuild. Host/port/username keep the current (non-secret) values as
# defaults so behavior is unchanged for anyone who already has MAIL_HOST/
# MAIL_PORT/MAIL_USERNAME set correctly; MAIL_PASSWORD has NO default - if
# it isn't set, spring.mail.password is empty and every send attempt fails
# fast and honestly (via OtpEmailDeliveryException / the same handling
# TalkToOurAdvisorServiceImpl and Userimpl.registerApi() already have),
# never with a hardcoded credential silently baked into the JAR.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:trainings@hachion.co}
spring.mail.password=${MAIL_PASSWORD:}
# Used by EmailUtil.sendOtpEmail() as the From: address instead of a
# hardcoded string literal - defaults to the same address as
# spring.mail.username unless explicitly overridden (e.g. if MAIL_USERNAME
# is an SES/SendGrid SMTP relay login that differs from the visible From
# address a recipient should see).
app.mail.from=${MAIL_FROM:${spring.mail.username}}
google.chat.webhook=${GOOGLE_CHAT_WEBHOOK_URL:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
logging.level.org.springframework.mail=DEBUG
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2


