app.frontend.base-url=https://hachion.co
# This backend's own public HTTPS origin (as opposed to app.frontend.base-url
# above) - used only to build an absolute redirect Location so it can't be
# affected by request.getScheme() resolving to "http" for a request that
# actually arrived over HTTPS (see SecurityConfig's OAuth2 success handler
# for why that matters: nginx terminates TLS and proxies to this app over
# plain HTTP without this app trusting X-Forwarded-Proto, so any *relative*
# redirect built from the current request was silently resolving to
# http://api.hachion.co/... - reproduced live via `curl -sD -
# https://api.hachion.co/login/oauth2/code/google?code=x&state=bad`, whose
# Location header came back as plain http, not https).
app.backend.base-url=https://api.hachion.co
# Per-profile Google OAuth callback (see application.properties for the
# unqualified default this overrides - kept identical in value here since
# this profile's redirect was always meant to be prod, but now explicit and
# consistent with dev/test instead of relying on the shared default) and the
# public prefix for anything under the prod uploads bucket (see
# EmailService.getCurriculumUrl / UploadImagesServiceImpl / interview
# uploads below).
spring.security.oauth2.client.registration.google.redirect-uri=${app.backend.base-url}/login/oauth2/code/google
app.uploads.public-base-url=${app.backend.base-url}/uploads/prod/
app.cookies.domain=.hachion.co
app.cookies.secure=true

# The JSESSIONID cookie itself (Spring Session's own cookie, distinct from
# the app-level flow/avatar/auth_error cookies above) had no explicit
# SameSite/Secure here, unlike application-test.properties which already
# sets both - confirmed live via `curl -sD -` against
# https://api.hachion.co/oauth2/authorization/google, which showed
# `Set-Cookie: JSESSIONID=...; Path=/; HttpOnly` with neither attribute.
# It was working by relying on Chrome's default-to-Lax-when-unset behavior
# (hachion.co and api.hachion.co are same-site, so Lax already covers the
# cross-subdomain fetches this app makes) rather than on an explicit,
# intentional setting - made explicit here to match test and stop relying
# on browser-default behavior for a production auth cookie.
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true

