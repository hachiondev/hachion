# Twilio Account SID / Auth Token are provider secrets - sourced entirely
# from the TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN environment variables on
# whichever host runs this jar (test EC2 box on the "test" profile, prod EC2
# box on the "prod" profile), never hardcoded here and never passed as a -D
# system property (those show up in `ps aux`/process listings; a process's
# own environment does not). No default value is intentional here (unlike
# e.g. spring.mail.password's ${MAIL_PASSWORD:} pattern) - WhatsAppService's
# own try/catch around every Twilio call already treats a missing/invalid
# credential as a caught, logged, non-fatal failure at send time, so Spring
# context startup must not fail just because these two env vars aren't set
# yet; TwilioConfigStartupCheck logs (booleans only, never the values)
# whether each one actually resolved, for exactly that "is it wired up"
# question without needing to read secrets to answer it.
twilio.accountSid=${TWILIO_ACCOUNT_SID:}
twilio.authToken=${TWILIO_AUTH_TOKEN:}
twilio.fromWhatsApp=whatsapp:+15163632917
twilio.contentSid=HX2fdacb529c55276d8826fdc978e1bbbb
twilio.demoContentSid=HX6696548b8a37f94ebea0eb2a4f86c7f4
twilio.fromSms=+15163632917

twilio.selfPacedContentSid=HX24be6bac97abe6fa931e0f0e79bb4016

