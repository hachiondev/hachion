
server.port=8080

# Local MySQL connection for running the app straight off a developer
# machine (as opposed to test/prod, which point at the shared EC2 MySQL
# host). DB_PASSWORD has no default, same pattern as test/prod - see
# spring.config.import below for where it can come from locally.
spring.datasource.url=jdbc:mysql://localhost:3306/hachion_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}


# The block below configures dev-only, absolute local-filesystem upload
# paths (Windows paths on the original dev machine), one property per
# upload category, each overridable via its matching env var. These mirror
# the same properties in application-{test,prod}.properties, which point at
# the test/prod EC2 hosts' upload trees instead.
spring.web.resources.static-locations=file:${STATIC_UPLOADS_PATH:C:/Users/hp/Downloads/HachionUserDashboard (3)/HachionUserDashboard/uploads}

image.upload.path=${IMAGE_UPLOAD_PATH:D:/HachionBackendCode/hachion/uploads/profile_images/}

image.upload.userreview.path=${IMAGE_UPLOAD_USERREVIEW_PATH:D:/HachionBackendCode/hachion/uploads/images/}

file.upload.instructor.resume.path=${FILE_UPLOAD_INSTRUCTOR_RESUME_PATH:D:/HachionBackendCode/hachion/uploads/}

banner.image.upload.path=${BANNER_IMAGE_UPLOAD_PATH:D:/HachionBackendCode/hachion/uploads/banner/}


# Note: this default is a prod-labeled EC2 path even under the dev profile -
# harmless as long as PAYMENTS_UPLOAD_PATH is set locally when needed, but
# worth knowing it isn't a dev-specific fallback like the properties above.
payments.upload.path=${PAYMENTS_UPLOAD_PATH:/home/ec2-user/uploads/prod/payments/}
invoice.path=${INVOICE_PATH:D:/HachionLatestVersion/hachion/uploads}
certificate.base-path=${CERTIFICATE_PATH:src/main/resources/templates/}

file.upload-dir=${FILE_UPLOAD_DIR:/uploads}

hirefromus.upload-dir=${HIREFROMUS_UPLOAD_DIR:D:/HachionBackendCode/hachion/uploads/}

applyjob.resume.upload.dir=${APPLYJOB_RESUME_UPLOAD_DIR:D:/HachionBackendCode/hachion/uploads/resumes}

user.profile.image.upload.dir=${USER_PROFILE_IMAGE_UPLOAD_DIR:D:/HachionBackendCode/hachion/uploads/profile_images/}

# Local frontend dev server origin (e.g. React/Vite on :3000).
app.frontend.base-url=http://localhost:3000
# See application-prod.properties for why this exists separately from
# app.frontend.base-url.
app.backend.base-url=http://localhost:8080
# Per-profile Google OAuth callback (see application.properties for the
# unqualified default this overrides) and the public prefix for reading back
# anything under file.upload-dir/interview.upload.dir/etc. Dev has no
# test/prod-style uploads split, so this stays a flat /uploads/ (matching
# file.upload-dir=/uploads above) instead of an env-named subfolder.
spring.security.oauth2.client.registration.google.redirect-uri=${app.backend.base-url}/login/oauth2/code/google
app.uploads.public-base-url=${app.backend.base-url}/uploads/

# Local-only secrets (GOOGLE_OAUTH_CLIENT_SECRET, DB_PASSWORD, ...) in a
# gitignored .env.local next to pom.xml, KEY=VALUE per line - the ${VAR}
# placeholders in these files resolve from it. Real environment variables
# still win over it. Optional, so a machine without the file starts as before.
spring.config.import=optional:file:./.env.local[.properties]

# Filesystem dir for InterviewMediaController's uploaded interview videos -
# was a hardcoded prod-only literal with no dev/test equivalent at all.
interview.upload.dir=${INTERVIEW_UPLOAD_DIR:D:/HachionBackendCode/hachion/uploads/interviews/}

image.upload.uploadEmployeeCompanyImage.path=${IMAGE_UPLOAD_EMPLOYEE_COMPANY_IMAGE_PATH:/home/ec2-user/uploads/prod/employee_company_logo/images/}

# Trainer Image Upload Directory (Absolute Path)
trainer.upload-dir=${TRAINER_UPLOAD_DIR:D:/HachionBackendCode/hachion/uploads/trainer_images}

tools.images.upload.path=${TOOLS_IMAGES_UPLOAD_PATH:D:/HachionBackendCode/hachion/uploads/}
