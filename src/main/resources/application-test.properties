server.port=8081

# Old alternate test DB (different host/db name), kept commented for
# reference rather than deleted.
#spring.datasource.url=jdbc:mysql://13.219.46.20:3306/testhachiondb
#spring.datasource.username=hachtech
# Test MySQL connection on the shared EC2 DB host. Username has a default
# ("hachtech"); DB_PASSWORD intentionally has no default (see the earlier
# root-cause investigation into the "using password: NO" startup failure) -
# it must be exported into the process environment before launching the jar.
spring.datasource.url=jdbc:mysql://13.219.46.20:3306/hachion_test
spring.datasource.username=${DB_USERNAME:hachtech}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Base directory for generic file uploads on the test EC2 host.
file.upload-dir=${FILE_UPLOAD_DIR:/home/ec2-user/uploads/test/}

# Was previously unset on this profile, so spring.web.resources.static-locations
# (below) and WebConfig's generic /uploads/** resource handler silently fell back
# to the base application.properties value (a relative "HachionUserDashboard/uploads"
# path), which does not resolve to any of the absolute /home/ec2-user/uploads/test/...
# locations the other upload properties on this profile actually write to. Mirrors
# the parent-directory convention application-prod.properties already uses.
upload.path=${UPLOAD_BASE_PATH:/home/ec2-user/uploads}

hirefromus.upload-dir=${HIREFROMUS_UPLOAD_DIR:/home/ec2-user/uploads/test/hirefromus/companylogos/}

applyjob.resume.upload.dir=${APPLYJOB_RESUME_UPLOAD_DIR:/home/ec2-user/uploads/test/hirefromus/resumes/}

# Serves upload.path above as static content under /uploads/**.
spring.web.resources.static-locations=file:${upload.path}/

# Remaining upload.* / *.path / *.upload.dir / *.upload-dir properties below
# are the test-bucket (/home/ec2-user/uploads/test/...) equivalents of the
# same properties documented in application.properties/-dev/-prod - one per
# upload category, each overridable via its own env var.
image.upload.path=${IMAGE_UPLOAD_PATH:/home/ec2-user/uploads/images/}
payments.upload.path=${PAYMENTS_UPLOAD_PATH:/home/ec2-user/uploads/test/payments/}
invoice.path=${INVOICE_PATH:/home/ec2-user/uploads/test/payments/invoices/}
certificate.base-path=${CERTIFICATE_PATH:/home/ec2-user/uploads/test/certificates/}
user.profile.image.upload.dir=${USER_PROFILE_IMAGE_UPLOAD_DIR:/home/ec2-user/uploads/test/profile_images/}

image.upload.userreview.path=${IMAGE_UPLOAD_USERREVIEW_PATH:/home/ec2-user/uploads/test/user_review/images/}

image.upload.corporatereview.path=${IMAGE_UPLOAD_CORPORATEREVIEW_PATH:/home/ec2-user/uploads/test/corporate_review/logos/}

file.upload.instructor.resume.path=${FILE_UPLOAD_INSTRUCTOR_RESUME_PATH:/home/ec2-user/uploads/test/instructor/resumes/}

# Hibernate auto-updates the schema against the test DB, logs generated SQL,
# and uses the MySQL 8 dialect - same intent as application.properties'
# defaults, restated explicitly for this profile.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

upload.all.images.path=${UPLOAD_ALL_IMAGES_PATH:/home/ec2-user/uploads/test/upload_all_images/}


app.frontend.base-url=https://test.hachion.co
# See application-prod.properties for why this exists separately from
# app.frontend.base-url.
app.backend.base-url=https://api.test.hachion.co
# Per-profile Google OAuth callback (see application.properties for the
# unqualified default this overrides - previously always the prod URI even
# under this profile, so Google Sign-In could never complete when running
# as test) and the public prefix for anything under the test uploads bucket
# (see EmailService.getCurriculumUrl / UploadImagesServiceImpl / interview
# uploads below - previously hardcoded to .../uploads/prod/... regardless
# of profile, so those specific links 404'd when run under test even though
# the files themselves were correctly saved into this test bucket).
spring.security.oauth2.client.registration.google.redirect-uri=${app.backend.base-url}/login/oauth2/code/google
app.uploads.public-base-url=${app.backend.base-url}/uploads/test/
# Cookie domain shared across hachion.co subdomains (so api.test.* and
# test.* can both read it); secure=true requires HTTPS, which this profile
# is always served over.
app.cookies.domain=.hachion.co
app.cookies.secure=true

# JSESSIONID (Spring Session's own cookie) explicitly forced Secure +
# SameSite=Lax rather than relying on browser default-to-Lax behavior.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

image.upload.uploadEmployeeCompanyImage.path=${IMAGE_UPLOAD_EMPLOYEE_COMPANY_IMAGE_PATH:/home/ec2-user/uploads/test/employee_company_logo/images/}

# Trainer Image Upload Directory (Absolute Path)
trainer.upload-dir=${TRAINER_UPLOAD_DIR:/home/ec2-user/uploads/test/trainer_images/}
tools.images.upload.path=${TOOLS_IMAGES_UPLOAD_PATH:/home/ec2-user/uploads/test/tools_images/}

banner.image.upload.path=${BANNER_IMAGE_UPLOAD_PATH:/home/ec2-user/uploads/test/banner_images/}

# Filesystem dir for InterviewMediaController's uploaded interview videos -
# was a hardcoded prod-only literal, so this profile always wrote/read
# interview videos out of the prod bucket instead of this one.
interview.upload.dir=${INTERVIEW_UPLOAD_DIR:/home/ec2-user/uploads/test/interviews/}
